<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Scroll to fill progress bar</title>
    <script defer src="script.js"></script>
  </head>
  <body>
    <div class="some">
      <h3>Scroll to fill progress bar</h3>
    </div>

    <section id="section">
      <h3>Progress Bar Section</h3>
      <p>
        როდესაც ამ სექციის 50% ხილული გახდება მაშინ შეივსება პროგრეს ბარები.
      </p>
      <div class="progress-bars">
        <div class="progress-bar" data-fill="70"></div>
        <div class="progress-bar" data-fill="100"></div>
        <div class="progress-bar" data-fill="40"></div>
      </div>
    </section>
  </body>
</html>
